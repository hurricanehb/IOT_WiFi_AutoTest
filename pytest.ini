[pytest]
pythonpath = .
testpaths = testcases
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --tb=short
    --strict-markers
    -ra
markers =
    wifi: Tests requiring traditional WiFi capability
    hyperwifi: Tests requiring HyperWiFi capability
    dualwifi: Tests requiring traditional WiFi and HyperWiFi concurrently
    common: Tests supported by both traditional WiFi and HyperWiFi devices
    p0: Priority P0 (requirement doc)
    p1: Priority P1
    p2: Priority P2
    p3: Priority P3
    country_code: Country code functional tests
    regression: Regression test type
    stress: Stress / long-running tests
    weaknet: Weak network simulation tests
    ai: Tests that invoke AI modules
    smoke: Smoke / fast sanity checks
    miniap: miniAP product domain tests
    case_id: Static test case ID for external result mapping (must be explicit)
    wifi_case: WiFi case metadata (title, pre) used by fixture and reports
    no_wifi_lifecycle: Skip android WiFi pre/post (enable radio / disconnect all)
    no_dual_wifi_setup: Skip dual WiFi connect in android_wifi_lifecycle pre-setup
    dual_wifi_eu: Use dual_wifi_list EU pair in lifecycle pre/post
    dual_wifi_us: Use dual_wifi_list US pair in lifecycle pre/post
    manual_placeholder: Declarative parameterized case requiring manual execution
    not_applicable: Declarative parameterized case outside the current product scope
filterwarnings =
    ignore::DeprecationWarning
    ignore:pkg_resources is deprecated as an API:UserWarning:uiautomator2.version
log_cli = false
log_cli_level = INFO
log_level = INFO
log_format = %(asctime)s | %(levelname)-8s | %(name)s:%(filename)s:%(lineno)d | %(message)s
log_date_format = %Y-%m-%d %H:%M:%S
log_file_format = %(asctime)s | %(levelname)-8s | %(name)s:%(filename)s:%(lineno)d | %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S

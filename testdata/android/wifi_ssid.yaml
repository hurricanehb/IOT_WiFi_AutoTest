# 传统WiFi + HyperWiFi (EU/US) + dual_wifi_list + 中文SSID + 加密方式
# 共享值只在此处维护；下方通过 YAML 锚点复用，变更实验室名称或默认密码无需逐项修改。
wifi_test_values:
  common_password: &common_password "24681357"
  default_traditional_ssid: &default_traditional_ssid  "MyXiaoMiWiFi" #"Lab_HW_AutoTest"
  hyperwifi_eu_ssid: &hyperwifi_eu_ssid "HyperWi-Fi_EU"
  hyperwifi_lab_miniap1_ssid: &hyperwifi_lab_miniap1_ssid "Lab_AT1_HyperWiFi_test_2"
  welcome_encrypted_ssid: &welcome_encrypted_ssid "MyXiaoMiWiFi" #"Lab_HW_AutoTest"  
  welcome_open_ssid: &welcome_open_ssid "Public_Free"
  welcome_hyperwifi_ssid: &welcome_hyperwifi_ssid "Lab_AT1_HyperWiFi_test_2" #"HyperWi-Fi_3C74_Office"  #

wifi_list:
  # --------------- 传统WiFi ---------------
  # 双频合一（AP0 radio0 ch1 + radio1 ch36，同名同 BSSID 前缀，wlan 13）
  - id: "wifi_ap_ssid_default"
    ssid: *default_traditional_ssid
    pwd: *common_password
    encrypt: "WPA2"
    bssids:
      2g: "54:f6:e2:e9:4a:4c"
      5g: "54:f6:e2:e9:4a:5c"
    type: "normal"
    region: ""
    expect: "connected"

  - id: "wifi_signal_level_traditional_ap1"
    ssid: "Lab_HW_WPA/WPA2_Test"
    pwd: *common_password
    encrypt: "WPA2"
    bssids:
      2g: "54:f6:e2:e9:4a:47"
      5g: "54:f6:e2:e9:4a:57"
    type: "normal"
    region: ""
    expect: "connected"

  - id: "wifi_wep40_lab"
    ssid: "Lab_HW_WEP-40_Test"
    password_env: "WIFI_WEP40_PASSWORD"
    encrypt: "WEP"
    type: "normal"
    region: ""
    expect: "connected"

  - id: "wifi_wep104_lab"
    ssid: "Lab_HW_WEP-104_Test"
    password_env: "WIFI_WEP104_PASSWORD"
    encrypt: "WEP"
    type: "normal"
    region: ""
    expect: "connected"

  - id: "wifi_wep128_lab"
    ssid: "Lab_HW_WEP-128_Test"
    password_env: "WIFI_WEP128_PASSWORD"
    encrypt: "WEP"
    type: "normal"
    region: ""
    expect: "connected"

  - ssid: "小米路由器_客厅"  # GBK中文SSID
    pwd: "86427531"
    encrypt: "WPA2"
    type: "normal"
    region: ""
    expect: "connected"

  - ssid: "Public_Free"
    pwd: ""
    encrypt: "OPEN"
    type: "normal"
    region: ""
    expect: "connected"

  - id: "wifi_owe_transition"
    ssid: "Lab_HW_OWE_Test"
    pwd: ""
    lab_flag: "OWE_TRANSITION_LAB"
    encrypt: "OWE"
    type: "normal"
    region: ""
    expect: "connected"

  # --------------- HyperWiFi EU 区 ---------------
  - id: "hyperwifi_eu"
    ssid: *hyperwifi_eu_ssid
    pwd: *common_password
    encrypt: "WPA3"
    type: "hyperwifi"
    region: "EU"
    expect: "connected"

  # --------------- HyperWiFi US 区 ---------------
  - id: "hyperwifi_us"
    ssid: "HyperWi-Fi_US"
    pwd: *common_password
    encrypt: "WPA3"
    type: "hyperwifi"
    region: "US"
    expect: "connected"

  - id: "hyperwifi_lab_miniap1"
    ssid: *hyperwifi_lab_miniap1_ssid
    pwd: *common_password
    encrypt: "WPA3"
    type: "hyperwifi"
    region: "US"
    expect: "connected"

  - id: "hyperwifi_lab_miniap2"
    ssid: "Lab_AT1_HyperWiFi_test_2"
    pwd: *common_password
    encrypt: "WPA3"
    type: "hyperwifi"
    region: "US"
    expect: "connected"

  # --------------- 失败用例 ---------------
  - ssid: *hyperwifi_eu_ssid
    pwd: "wrongpass"
    encrypt: "WPA3"
    type: "hyperwifi"
    region: "EU"
    expect: "auth_fail"

  # --------------- Welcome 组件指定网络 ---------------
  # ConnCfg、NetDetails 共用同一加密网络及密码。
  - id: "welcome_connection_wpa2"
    ssid: *welcome_encrypted_ssid
    pwd: *common_password
    encrypt: "WPA2"
    type: "normal"
    region: ""
    expect: "connected"

  - id: "welcome_connection_open"
    ssid: *welcome_open_ssid
    pwd: ""
    encrypt: "OPEN"
    type: "normal"
    region: ""
    expect: "connected"

  - id: "welcome_hyperwifi"
    ssid: *welcome_hyperwifi_ssid
    pwd: *common_password
    encrypt: "WPA3"
    type: "hyperwifi"
    region: "US"
    expect: "connected"

# 信号等级实验室拓扑：profile 引用已有连接数据，通道由 attenuator_channels 决定。
signal_level_lab:
  traditional_entry_id: "wifi_signal_level_traditional_ap1"
  hyper_dual_entry_id: "dual_wifi_24g_hyperwifi_us"
  ap_index: 1

# 产品 PAT 基线由性能团队按 case_id 提供。未配置时先执行两组数据采集，
# 不使用通用吞吐阈值冒充产品曲线基线。
performance_pat: {}

# IP 配置实验室拓扑（Func_WlanAccess_Conn_IPCfg_*）。
ipcfg_lab:
  ap1:
    ssid: *default_traditional_ssid
    expected_network: "192.168.2.0/24"
    gateway: "192.168.2.1"
    dns: ["114.114.114.114", "223.5.5.5"]
  # 启用续租和双 AP 更新用例时，补充 lease_wait_sec 和 ap2。
  # ap2:
  #   ssid: "LAB_IPCFG_AP2"
  #   expected_network: "192.168.2.0/24"
  #   gateway: "192.168.2.1"
  #   dns: ["192.168.2.1"]

# 双 WiFi 场景：传统 WiFi + HyperWiFi 成对（同时连接 / 后置断开校验）
# 传统腿用双频合一 Lab_HW_AutoTest（2.4G ch1 + 5G ch36）；ch1 在所有管制域均开放，
# 国家码遍历时至少 2.4G 腿不会被射频规则滤除。
dual_wifi_list:
  - id: "dual_wifi_24g_hyperwifi_us"
    description: "wifi 双频合一 + HyperWiFi US"
    traditional_wifi:
      ssid: *default_traditional_ssid
      pwd: *common_password
      encrypt: "WPA2"
      type: "normal"
      region: ""
      expect: "connected"
    hyper_wifi:
      ssid: *hyperwifi_lab_miniap1_ssid
      pwd: *common_password
      encrypt: "WPA3"
      type: "hyperwifi"
      region: "US"
      expect: "connected"

  - id: "dual_wifi_24g_hyperwifi_eu"
    description: "wifi 双频合一 + hyperWiFi EU"
    traditional_wifi:
      ssid: *default_traditional_ssid
      pwd: *common_password
      encrypt: "WPA2"
      type: "normal"
      region: ""
      expect: "connected"
    hyper_wifi:
      ssid: *hyperwifi_eu_ssid
      pwd: *common_password
      encrypt: "WPA3"
      type: "hyperwifi"
      region: "EU"
      expect: "connected"



